name: Bug report
description: Report reproducible incorrect behavior without sharing private text.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: >-
        Use synthetic text and paths. Do not attach real vents, settings,
        summary metadata, credentials, or unredacted terminal captures.
  - type: input
    id: version
    attributes:
      label: Venting version
      placeholder: "0.5.0 or commit SHA"
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: "OS, Python version, terminal"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction with synthetic content
      description: Include the keys pressed and the smallest safe example.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed real journal content, private paths, settings, and credentials.
          required: true

